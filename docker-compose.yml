services:
  prediction-service:
    build:
      context: ./services/prediction-service
    container_name: connectivity-prediction-service
    ports:
      - "8003:8003"
    environment:
      - MAX_RAM_MB=1024
      - APP_CACHE_DIR=/app/shared-cache
    volumes:
      - ./services/prediction-service/models:/app/models
      - ./cache:/app/shared-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  data-service:
    build:
      context: ./services/data-service
    container_name: connectivity-data-service
    depends_on:
      prediction-service:
        condition: service_healthy
    environment:
      - SUPPORTED_CITIES=bangalore
      - DEFAULT_CITY=bangalore
      - PREDICTION_SERVICE_URL=http://prediction-service:8003
      - APP_CACHE_DIR=/app/shared-cache
      - GRAPH_CACHE_DIR=/app/shared-cache/graphs
      - HOTSPOT_CACHE_PATH=/app/shared-cache/hotspots.json
      - HEATMAP_VIEWPORT_ONLY=1
      - ROUTING_MODES=fastest,balanced,connected
      - MAX_RAM_MB=1536
      - OPENCELLID_KEYS=${OPENCELLID_KEYS:-}
      - OPENCELLID_TOKEN=${OPENCELLID_TOKEN:-}
      - OPENCELLID_KEY_STATE_PATH=/app/shared-cache/towers/api_key_state.json
      - TOWER_CACHE_DB_PATH=/app/shared-cache/towers/tower_cache.db
      - LOCAL_TOWER_CSV_PATH=/app/shared-cache/towers/bangalore_towers.csv
      - LOCAL_TOWER_PROVENANCE=${LOCAL_TOWER_PROVENANCE:-unknown}
      - REAL_SCORE_DIR=/app/shared-cache/scores
      - TOWER_DIR=/app/shared-cache/towers
    ports:
      - "8001:8001"
    volumes:
      - ./cache:/app/shared-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 20s

  routing-engine:
    build:
      context: ./services/routing-engine
    container_name: connectivity-routing-engine
    depends_on:
      data-service:
        condition: service_healthy
    environment:
      - SUPPORTED_CITIES=bangalore
      - DEFAULT_CITY=bangalore
      - DATA_SERVICE_URL=http://data-service:8001
      - APP_CACHE_DIR=/app/shared-cache
      - GRAPH_CACHE_DIR=/app/shared-cache/graphs
      - ROUTE_CACHE_PATH=/app/shared-cache/route_cache.json
      - HEATMAP_VIEWPORT_ONLY=1
      - ROUTING_MODES=fastest,balanced,connected
      - MAX_RAM_MB=2048
    ports:
      - "8002:8002"
    volumes:
      - ./services/routing-engine/data:/app/data
      - ./cache:/app/shared-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 20s

  visualization:
    build:
      context: ./services/visualization
    container_name: connectivity-visualization
    depends_on:
      data-service:
        condition: service_healthy
      routing-engine:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: connectivity-gateway
    depends_on:
      prediction-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      routing-engine:
        condition: service_healthy
      visualization:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1/api/ready/data >/dev/null &&
          wget -qO- http://127.0.0.1/api/ready/routing >/dev/null &&
          wget -qO- http://127.0.0.1/api/ready/prediction >/dev/null &&
          wget -qO- http://127.0.0.1/ >/dev/null
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s
