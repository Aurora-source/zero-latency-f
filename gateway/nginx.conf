# Production frontend and the complete allowlist of public API paths.
# Includes /api/cities, /api/city-context/, /api/hotspots/, /api/corridor-towers,
# /api/corridor-scores, /api/cache-status, /api/tiles/, /api/scores/,
# /api/route, /api/preload/, /api/segments/ and /api/geocode.
map $uri $api_upstream {
    default "";
    ~^/api/(route/?|preload/[^/]+)$ routing-engine:8002;
    ~^/api/(cities/?|city-context/[^/]+|hotspots/[^/]+|segments/[^/]+|corridor-towers/?|corridor-scores/?|cache-status/?|geocode|tiles/.+|scores/(source/)?[^/]+)$ data-service:8001;
    ~^/api/predict/?$ prediction-service:8003;
    ~^/api/(health|ready)/data$ data-service:8001;
    ~^/api/(health|ready)/routing$ routing-engine:8002;
    ~^/api/(health|ready)/prediction$ prediction-service:8003;
}
map $uri $backend_uri {
    ~^/api/(health|ready)/(data|routing|prediction)$ /$1;
    ~^/api/(.+)/$ /$1;
    ~^/api/(.*)$ /$1;
    default "";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
    # Keep security headers when nested locations add cache/retry headers.
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }
    location /api/ {
        if ($api_upstream = "") { return 404; }
        limit_except GET POST OPTIONS { deny all; }
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard spoofed incoming forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://$api_upstream$backend_uri$is_args$args;
        proxy_intercept_errors on;
        error_page 502 504 =503 @unavailable;
    }
    location @unavailable {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"detail":"A required service is temporarily unavailable. Please retry shortly."}';
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ /index.html;
    }
}
